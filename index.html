    <script>
      const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
      const ctx2 = new (window.AudioContext || window.webkitAudioContext)();
      const sounds = {};
      async function load(name, file) { // load sound
      	const response = await fetch(`https://scratchy2.github.io/prototypestudios/assets/${file}?t=${Date.now()}`);
      	if (!response.ok) throw new Error(`failed to load ${name}: ${response.status}`);
      	const data = await response.arrayBuffer();
      	sounds[name] = await ctx2.decodeAudioData(data);
      }
      function sound(name, rate=1, when=ctx2.currentTime, vol=1) { // play sound
      	const buffer = sounds[name];
      	if (!buffer) return;
      	const play = () => {
      		const source = ctx2.createBufferSource();
      		const gain = ctx2.createGain();
      		source.buffer = buffer;
      		source.playbackRate.value = rate;
      		gain.gain.value = vol;
      		source.connect(gain);
      		gain.connect(ctx2.destination);
      		source.start(Math.max(when, ctx2.currentTime));
      		return source;
      	};
      	if (ctx2.state != "running") {
      		ctx2.resume().then(play);
      		return;
      	}
      	return play();
      }
      (async () => {await Promise.all([ // preload sounds
      	load("A1lines", "4_1LINES.mp3"),
      	load("A2lines", "4_2LINES.mp3"),
      	load("A4lines", "4_4LINES.mp3"),
      	load("A8lines", "4_8LINES.mp3"),
      	load("A15lines", "4_15LINES.mp3"),
      	load("A24lines", "4_24LINES.mp3"),
      	load("A1linesSpin", "4_1LINES_SPIN.mp3"),
      	load("A2linesSpin", "4_2LINES_SPIN.mp3"),
      	load("A4linesSpin", "4_4LINES_SPIN.mp3"),
      	load("A8linesSpin", "4_8LINES_SPIN.mp3"),
      	load("A15linesSpin", "4_15LINES_SPIN.mp3"),
      	load("A24linesSpin", "4_24LINES_SPIN.mp3"),
      	load("Aplace", "4_place.wav"),
      	load("Acombo", "4_combo.wav"),
      	load("Aclear", "4_clear.mp3"),
      	load("Awin", "4_win.mp3"),
      	load("Alose", "4_lose.mp3"),
      	load("Adie", "4_die.mp3")
      ])})();
      function aic(bot) { // create game
      	return {
      		ai: bot,
      		vol: bot ? 0.5 : 1,
      		board: Array.from({length: bh}, () => Array(bw).fill(null)),
      		curr: {},
      		held: {},
      		bag: bagf([]),
      		hold: true,
      		lockat: 0,
      		resets: 15,
      		combo: 0,
      		pcsave: false,
      		surge: 0,
      		sent: 0,
      		grace: 0,
      		last: 0,
      		rotated: false,
      		dead: false,
      		pending: [],
      		foe: null,
      		cfg: null,
      		plan: null,
      		born: 0,
      		next: 0,
      		step: 0,
      		left: 0,
      		top: 0,
      		size: 0,
      		by: 0,
      		shake: 0,
      		fx: [],
      		fxt: 0,
      		pop: null,
		name: "",
		ent: null,
		diedAt: 0,
		place: 0,
		tilt: 1,
		u: 1,
		labelY: 0,
		startT: 0,
		rate: 0
      	};
      }
      function setgames(defs) { // create the boards for a round
	const nc = defs.filter(d => d.cfg).length;
	gs = defs.map(d => {
		const g = aic(!!d.cfg);
		g.cfg = d.cfg || null;
		g.name = d.name;
		g.ent = d.ent || null;
		if (d.cfg) g.vol = 0.5 / Math.sqrt(Math.max(1, nc - 1));
		return g;
	});
	p = gs.find(g => !g.ai) || gs[0];
	tuned = gs.find(g => g.ai) || gs[0];
	view = p.ai ? null : p; // the board shown large
	unrated = false;
	const t0 = performance.now();
	for (const g of gs) {g.startT = t0; g.rate = g.ai ? cpuRating(g.cfg) : 0;}
	over = 0;
	inp = newinp();
	for (const g of gs) spawn(g);
}
function start() { // start game
	bw = setup.w;
	bh = setup.h;
	full = (1 << bw) - 1;
	spawnx = Math.floor(bw / 2) - 2;
	tour = null;
	screen = "play";
	const m = modes[setup.mode];
	const c = setup.cpus;
	const n = setup.counts[m.id];
	const bot = i => ({name: "CPU " + (i + 1), cfg: c[i]});
	if (m.id == "duel") setgames([{name: "You"}, {name: "CPU", cfg: c[1]}]);
	else if (m.id == "cvc") setgames([{name: "Left CPU", cfg: c[0]}, {name: "Right CPU", cfg: c[1]}]);
	else if (m.id == "arena") setgames([{name: "You"}, ...Array.from({length: n}, (_, i) => bot(i))]);
	else if (m.id == "brawl") setgames(Array.from({length: n}, (_, i) => bot(i)));
	else tourStart(n);
}
function tourStart(n) { // tournament: you plus n cpus, every cpu picked near your rating
	const cpus = shuffle(Array.from({length: n}, (_, i) => {
		const lv = ratedLevel();
		return {name: "CPU " + (i + 1), cfg: {level: lv, pps: levels[lv].pps}};
	}));
	const field = [{name: "You", human: true, cfg: null}, ...cpus];
	tour = {field: field, rounds: Math.ceil(Math.log2(field.length)), round: 0, matches: [], mi: 0, cur: 0, winners: [], byes: [], champ: null, nextAt: 0, last: null};
	tourRound();
	tourMatch();
}
function simWinner(a, b) { // decide a cpu vs cpu match instantly by strength
	const pa = 1 / (1 + Math.pow(10, (cpuRating(b.cfg) - cpuRating(a.cfg)) / 400));
	return Math.random() < pa ? a : b;
}
function tourRound() { // pair up the remaining players; an odd one out gets a bye
	const f = tour.field.slice().sort((a, b) => (b.human ? 1 : 0) - (a.human ? 1 : 0)); // you first, so you never get the bye
	const youIn = f.some(e => e.human);
	tour.round += 1;
	tour.matches = [];
	tour.winners = [];
	tour.byes = [];
	for (let i = 0; i + 1 < f.length; i += 2) {
		const m = [f[i], f[i + 1]];
		if (youIn && !m.some(e => e.human)) tour.winners.push(simWinner(m[0], m[1])); // matches you aren't in are settled instantly
		else tour.matches.push(m);
	}
	if (f.length % 2) {tour.winners.push(f[f.length - 1]); tour.byes.push(f[f.length - 1]);}
	tour.mi = 0;
}
function tourMatch() { // start the current match
	tour.cur = tour.mi;
	setgames(tour.matches[tour.mi].map(e => ({name: e.name, cfg: e.cfg, ent: e})));
}
function tourFinish() { // a match just ended
	const win = gs.find(g => !g.dead);
	if (win) {
		tour.winners.push(win.ent);
		tour.mi += 1;
		if (tour.mi >= tour.matches.length && tour.winners.length == 1) tour.champ = win.ent;
	}
	tour.last = win ? win.ent : null;
	tour.nextAt = tour.champ ? Infinity : performance.now() + 2800;
}
function tourAdvance() { // go to the next match (a draw is replayed)
	if (!tour || !over || tour.champ) return;
	if (tour.mi >= tour.matches.length) {
		tour.field = tour.winners;
		tourRound();
	}
	tourMatch();
}
function tourSkip() { // decide the current match by cpu strength (never one you're playing in)
	if (!tour || over || gs.some(g => !g.ai)) return;
	const [a, b] = gs;
	(simWinner(a, b) == a ? b : a).dead = true;
}
function stackh(g) { // height of a board's stack
	const top = g.board.findIndex(r => r.some(c => c != null));
	return top < 0 ? 0 : bh - top;
}
function send(g, n) { // route garbage to the other boards
	const fs = gs.filter(o => o !== g && !o.dead);
	if (fs.length == 0) return;
	const hole = () => Math.floor(Math.random() * bw);
	if (setup.target == "high" && fs.length > 1) { // everything to the tallest stack
		let best = [];
		let hi = -1;
		for (const o of fs) {
			const h = stackh(o);
			if (h > hi) {hi = h; best = [o];}
			else if (h == hi) best.push(o);
		}
		best[Math.floor(Math.random() * best.length)].pending.push({n: n, hole: hole()});
		return;
	}
	const each = Math.floor(n / fs.length); // spread evenly, leftovers go to random boards
	const extra = n % fs.length;
	shuffle(fs.slice()).forEach((o, i) => {
		const k = each + (i < extra ? 1 : 0);
		if (k > 0) o.pending.push({n: k, hole: hole()});
	});
}
      function setlevel(cfg, i) { // set ai level
      	cfg.level = Math.min(levels.length - 1, Math.max(0, i));
      	cfg.pps = levels[cfg.level].pps;
      }
      function bump(cfg, d) { // set ai pps
      	cfg.pps = Math.min(20, Math.max(0.1, Math.round((cfg.pps + d) * 10) / 10));
      }
      function rows() { // menu rows
	const m = modes[setup.mode];
	const rs = [{type: "mode"}];
	if (m.id == "duel") rs.push({type: "skill", cpu: 1, label: "CPU skill"}, {type: "pps", cpu: 1, label: "CPU speed"});
	else if (m.id == "cvc") rs.push({type: "skill", cpu: 0, label: "Left CPU skill"}, {type: "pps", cpu: 0, label: "Left CPU speed"}, {type: "skill", cpu: 1, label: "Right CPU skill"}, {type: "pps", cpu: 1, label: "Right CPU speed"});
	else {
		rs.push({type: "count"});
		if (m.id == "tourney") rs.push({type: "note"});
		else {
			rs.push({type: "target"});
			for (let i = 0; i < setup.counts[m.id]; i++) rs.push({type: "cpu", cpu: i});
			rs.push({type: "randomize"});
		}
	}
	rs.push({type: "width"}, {type: "height"}, {type: "spin"}, {type: "boards"}, {type: "pieces"}, {type: "controls"}, {type: "start"});
	return rs;
}
      function immobile(g, matrix=g.curr.matrix, x=g.curr.x, y=g.curr.y) { // immobile check
      	return collision(g, matrix, x - 1, y) && collision(g, matrix, x + 1, y) && collision(g, matrix, x, y - 1) && collision(g, matrix, x, y + 1);
      }
      function spinCheck(g, name, matrix, x, y, rotated) { // rotation-based all-spin detection
      	if (!rotated) return false;
      	// T uses the three-of-four corner test. Every other piece counts as a spin when
      	// its rotation leaves it immobile. The optional loose mode broadens non-T spins
      	// to any rotated placement touching the stack.
      	if (name != "T") return setup.spinall ? touching(g, matrix, x, y) : immobile(g, matrix, x, y);
      	const last = matrix.length - 1;
      	const corners = [[0, 0], [last, 0], [0, last], [last, last]];
      	let occupied = 0;
      	for (const [dx, dy] of corners) {
      		const bx = x + dx;
      		const by = y + dy;
      		if (bx < 0 || bx >= bw || by >= bh || (by >= 0 && g.board[by][bx] != null)) occupied += 1;
      	}
      	return occupied >= 3;
      }
      function touching(g, matrix=g.curr.matrix, x=g.curr.x, y=g.curr.y) { // touching other block
      	for (let row = 0; row < matrix.length; row++) {
      		for (let col = 0; col < matrix[row].length; col++) {
      			if (!matrix[row][col]) continue;
      			for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
      				const bx = x + col + dx;
      				const by = y + row + dy;
      				if (bx >= 0 && bx < bw && by >= 0 && by < bh && g.board[by][bx] != null) return true;
      			}
      		}
      	}
      	return false;
      }
      function stuck(g) { // no possible placements
      	return reach(g, g.curr.name, g.curr.x, g.curr.y, g.curr.rot).length == 0;
      }
      function collision(g, piece, x, y) { // collision check
      	for (let row = 0; row < piece.length; row++) {
      		for (let col = 0; col < piece[row].length; col++) {
      			if (!piece[row][col]) continue;
      			const bx = x + col;
      			const by = y + row;
      			if (bx < 0 || bx >= bw || by >= bh) return true;
      			if (by >= 0 && g.board[by][bx] != null) return true;
      		}
      	}
      	return false;
      }
      function power(lines, combo, spin) { // # of lines sent
      	let c = (lines - 1 + combo / 20 + (spin ? 1 : 0)) * (0.5 + combo / 2);
      	if (spin) c *= 2;
      	return Math.floor(c);
      }
      function cancel(g, n) { // garbage cancel
      	while (n > 0 && g.pending.length > 0) {
      		const chunk = g.pending[0];
      		const take = Math.min(chunk.n, n);
      		chunk.n -= take;
      		n -= take;
      		if (chunk.n == 0) g.pending.shift();
      	}
      	return n;
      }
      function garbage(g) { // incoming garbage
      	let n = 0;
      	while (g.pending.length > 0 && n < cap) {
      		const chunk = g.pending[0];
      		const take = Math.min(chunk.n, cap - n);
      		for (let i = 0; i < take; i++) {
      			if (g.board[0].some(cell => cell != null)) g.dead = true;
      			g.board.shift();
      			g.board.push(Array.from({length: bw}, (_, x) => x == chunk.hole ? null : trash));
      		}
      		chunk.n -= take;
      		n += take;
      		if (chunk.n == 0) g.pending.shift();
      	}
      	if (n > 0) hit(g, n);
      }
      function clear(g, spin) { // clear lines
      	let c = 0;
      	const gone = []; // rows being cleared
      	for (let r = bh - 1; r >= 0; r--) {
      		if (g.board[r].every(cell => cell != null)) {
      			gone.push({y: r - c, cells: g.board[r].slice()});
      			g.board.splice(r, 1);
      			g.board.unshift(Array(bw).fill(null));
      			c += 1;
      			r += 1;
      		}
      	}
      	if (c == 0) {
      		if (g.pcsave) { // perfect clear keeps combo for one placement
      			g.pcsave = false;
      			return 0;
      		}
      		g.combo = 0;
      		g.surge = 0;
      		return 0;
      	}
      	const lines = c;
      	burst(g, gone, lines);
      	g.combo += 1;
      	c = power(lines, g.combo, spin);
      	const perfect = g.board.every(r => r.every(cell => cell == null));
      	g.pcsave = perfect;
      	if (perfect) c *= 2;
      	g.surge += c;
      	g.sent += c;
      	const pitch = 2 ** (Math.min(g.combo - 2, 24) / 24); // +0.5 semitones per combo, capped at +12
      	if (g.combo > 1) sound("Acombo", pitch, ctx2.currentTime, g.vol);
      	const left = cancel(g, c);
      	if (left > 0) send(g, left);
      	const sfx = c == 1 ? "A1lines" : c < 4 ? "A2lines" : c < 8 ? "A4lines" : c < 15 ? "A8lines" : c < 24 ? "A15lines" : "A24lines";
      	sound(sfx + (spin ? "Spin" : ""), 1, ctx2.currentTime, g.vol);
      	if (perfect) sound("Aclear", 1, ctx2.currentTime, g.vol);
      	if (c > 0) g.pop = {n: c, perfect: perfect, born: performance.now(), ox: -100 + Math.random() * 60, oy: 0.3 + Math.random() * 0.45, rot: (Math.random() - 0.5) * 0.4, hue: Math.floor(Math.random() * 360)};
      	return lines;
      }
      function spawn(g) { // spawn next piece
      	bagf(g.bag);
      	g.rotated = false;
      	const next = g.bag.shift();
      	g.curr = {name: next, matrix: pieces[next], source: pieces[next].map((r, y) => r.map((_, x) => ({sx: x * 20, sy: y * 20}))), x: spawnx, y: spawny, rot: 0};
      	if (g.resets > 0) {g.lockat = 0; g.resets -= 1;}
      	if (collision(g, g.curr.matrix, g.curr.x, g.curr.y) || touching(g) || stuck(g)) g.dead = true; // top out

      function lock(g) { // lock piece
      	if (collision(g, g.curr.matrix, g.curr.x, g.curr.y + 1)) {
      		if (g.resets > 0) {g.lockat = performance.now() + 500; g.resets -= 1}
      	} else {
      		g.lockat = 0;
      	}
      }
      function reset(piece) { // piece back to initial state
      	if (piece.name == "UL") piece.name = "U";
      	piece.matrix = pieces[piece.name];
      	piece.source = pieces[piece.name].map((r, y) => r.map((_, x) => ({sx: x * 20, sy: y * 20})));
      	piece.x = spawnx;
      	piece.y = spawny;
      	piece.rot = 0;
      }
      function swap(g) { // swap with hold piece
      	if (!g.held.name) {
      		g.held = g.curr;
      		spawn(g);
      	}
      	else {
      		[g.held, g.curr] = [g.curr, g.held];
      		g.rotated = false;
      	}
      	reset(g.held);
      	g.hold = false;
      	if (g.resets > 0) {g.lockat = 0; g.resets -= 1;}
      	if (collision(g, g.curr.matrix, g.curr.x, g.curr.y) || touching(g) || stuck(g)) g.dead = true; // top out
      }
      function options(g) { // every placement reachable with the current or hold piece
	const roots = [{name: g.curr.name, x: g.curr.x, y: g.curr.y, rot: g.curr.rot, next: g.bag[0]}];
	if (g.hold) {
		if (g.held.name) roots.push({name: g.held.name, x: spawnx, y: spawny, rot: 0, next: g.bag[0]});
		else roots.push({name: g.bag[0], x: spawnx, y: spawny, rot: 0, next: g.bag[1]});

	for (const r of roots) for (const c of reach(g, r.name, r.x, r.y, r.rot)) out.push({cells: c.cells, next: r.next});

}
function spawnhit(rows, name) { // would a piece spawning on these rows top out
	if (!name) return false;
	const m = pieces[name];
	for (let row = 0; row < m.length; row++) {
		for (let col = 0; col < m[row].length; col++) {
			if (!m[row][col]) continue;
			for (const [dx, dy] of [[0, 0], [-1, 0], [1, 0], [0, -1], [0, 1]]) {
				const bx = spawnx + col + dx;
				const by = spawny + row + dy;

function lost(g) { // can't continue the combo and garbage tops you out wherever you place

function place(g) { // place down piece

      	const spin = spinCheck(g, g.curr.name, g.curr.matrix, g.curr.x, g.curr.y, g.rotated);
      	for (let row = 0; row < g.curr.matrix.length; row++) {
      		for (let col = 0; col < g.curr.matrix[row].length; col++) {
      			if (!g.curr.matrix[row][col]) continue;
      			const bx = g.curr.x + col;
      			const by = g.curr.y + row;
      			if (by < 0) {
      				g.dead = true;
      				return; // game over
      			}
      			const source = g.curr.source[row][col];
      			g.board[by][bx] = {name: g.curr.name, sx: source.sx, sy: source.sy, q: source.q, rot: g.curr.rot};

      function move(g, dx, dy, kick=false) { // move piece

      		return false;
      	}
      	g.curr.x += dx;
      	g.curr.y += dy;

      	lock(g);
      	return true;
      }
      function drop(g) { // hard drop; falling any distance after a rotation invalidates the spin

      	while (!collision(g, g.curr.matrix, g.curr.x, g.curr.y + 1)) g.curr.y += 1;
      	if (g.curr.y != y0) g.rotated = false;

      function rotatem(matrix, dir="cw") { // rotate matrix

      	} else if (dir == "180") {
      		return matrix.map(row => row.slice().reverse()).reverse();

      	ctx.textAlign = "center";
      	ctx.fillStyle = "#bdb7ff";
      	ctx.font = "bold 48px Kanchenjunga";
      	ctx.fillText("SETTINGS", cw / 2, 70);
      	const top = 135;
      	const gap = Math.min(40, (ch - top - 110) / (rs.length + 1));
      	const fs = Math.max(14, Math.min(24, gap * 0.6));
      	rs.forEach((row, i) => {
      		const y = top + (i + (i >= handlingInfo.length ? 0.5 : 0) + (i >= handlingInfo.length + keyOrder.length ? 0.5 : 0)) * gap;
      		let text = "Back";
      		if (row.type == "h") text = `${row.info.label}:  < ${hlabel(row.info)} >`;
      		else if (row.type == "key") text = `${keyNames[row.action]}:  ${binding == row.action ? "press a key..." : `[ ${keylabel(keys[row.action])} ]`}`;
      		else if (row.type == "reset") text = "Reset to defaults";
      		if (i == csel) {
      			ctx.fillStyle = "#2a0a6b";
      			ctx.fillRect(cw / 2 - 380, y - fs * 1.05, 760, fs * 1.45);
      		}
      		ctx.fillStyle = i == csel ? "#ffffff" : "#bdb7ff";
      		ctx.font = `bold ${fs}px Kanchenjunga`;
      		ctx.fillText(text, cw / 2, y);
      	});
      	ctx.fillStyle = "#bdb7ff";
      	ctx.font = "14px Kanchenjunga";
      	ctx.fillText("Up/Down  select     Left/Right  change (Shift: ±5)     Enter  rebind     Esc  back", cw / 2, ch - 62);
      	if (bindmsg) {
      		ctx.fillStyle = "#ff8888";
      		ctx.fillText(bindmsg, cw / 2, ch - 18);
      	}
      	ctx.textAlign = "start";
      }
      function ctlkey(event) { // controls screen input
      	const rs = ctlrows();
      	if (binding) {
      		if (event.key == "Escape") {binding = null; bindmsg = ""; return;}
      		const k = norm(event.key);
      		if (["Shift", "Control", "Alt", "Meta", "CapsLock"].includes(k)) return;
      		if (reserved.includes(k)) {bindmsg = `${keylabel(k)} is reserved`; return;}
      		const other = keyOrder.find(a => a != binding && keys[a] == k);
      		if (other) keys[other] = keys[binding];
      		keys[binding] = k;
      		binding = null;
      		bindmsg = "";
      		savectl();
      		return;
      	}
      	const row = rs[csel];
      	if (event.key == "ArrowUp") csel = (csel + rs.length - 1) % rs.length;
      	else if (event.key == "ArrowDown") csel = (csel + 1) % rs.length;
      	else if (event.key == "Escape") screen = "menu";
      	else if ((event.key == "ArrowLeft" || event.key == "ArrowRight") && row.type == "h") {
      		adjh(row.info, (event.key == "ArrowLeft" ? -1 : 1) * (event.shiftKey ? 5 : 1));
      		savectl();
      	} else if (event.key == "Enter" || event.key == " ") {
      		if (row.type == "key") {binding = row.action; bindmsg = "";}
      		else if (row.type == "reset") {keys = {...defaultKeys}; handling = {...defaultHandling}; savectl();}
      		else if (row.type == "back") screen = "menu";
      	}
      }
      const font = new FontFace("Kanchenjunga", "url(https://fonts.gstatic.com/s/kanchenjunga/v2/RWmPoKKd5fUmrILiWsjCI6TSroEH.woff2)");
      document.fonts.add(font);
      let loop = requestAnimationFrame(render);
      window.onkeydown = (event) => {
	event.preventDefault();
	if (event.repeat) return;
	pres[event.key] = true;
	const step = event.key == "-" ? -0.1 : event.key == "=" ? 0.1 : event.key == "_" ? -1 : event.key == "+" ? 1 : 0;
	if (screen == "menu") {
		const rs = rows();
		sel = Math.min(sel, rs.length - 1);
		const row = rs[sel];
		const cfg = setup.cpus[row.cpu];
		const m = modes[setup.mode];
		const key = event.key;
		if (key == "ArrowUp") {
			sel = (sel + rs.length - 1) % rs.length;
		} else if (key == "ArrowDown") {
			sel = (sel + 1) % rs.length;
		} else if (key == "ArrowLeft" || key == "ArrowRight") {
			const d = key == "ArrowLeft" ? -1 : 1;
			if (row.type == "mode") setup.mode = (setup.mode + d + modes.length) % modes.length;
			else if (row.type == "count") setup.counts[m.id] = Math.min(m.max, Math.max(m.min, setup.counts[m.id] + d * (event.shiftKey ? 5 : 1)));
			else if (row.type == "target") setup.target = setup.target == "even" ? "high" : "even";
			else if (row.type == "skill") setlevel(cfg, cfg.level + d);
			else if (row.type == "cpu") {if (event.shiftKey) bump(cfg, d); else setlevel(cfg, cfg.level + d);}
			else if (row.type == "pps") bump(cfg, d * (event.shiftKey ? 1 : 0.1));
			else if (row.type == "width") setup.w = Math.min(20, Math.max(4, setup.w + d * (event.shiftKey ? 5 : 1)));
			else if (row.type == "height") setup.h = Math.min(40, Math.max(8, setup.h + d * (event.shiftKey ? 5 : 1)));
			else if (row.type == "spin") setup.spinall = !setup.spinall;
			else if (row.type == "boards") setup.forceAllBoards = !setup.forceAllBoards;
			else if (row.type == "pieces") bagc = (bagc + d + names.length) % names.length;
		} else if (/^[0-9]$/.test(key) && (row.type == "skill" || row.type == "cpu")) {
			setlevel(cfg, key == "0" ? 9 : key - 1);
		} else if (step && (row.type == "pps" || row.type == "cpu")) {
			bump(cfg, step);
		} else if (row.type == "randomize" && (key == "Enter" || key == " ")) {
			for (const c of setup.cpus) setlevel(c, ratedLevel());
		} else if (row.type == "pieces" && (key == "Enter" || key == " ")) {
			bagt(bagc);
		} else if (row.type == "pieces" && names.includes(key.toUpperCase())) {
			bagc = names.indexOf(key.toUpperCase());
			bagt(bagc);
		} else if (row.type == "controls" && (key == "Enter" || key == " ")) {
			screen = "controls"; csel = 0; binding = null; bindmsg = "";
		} else if (key == "Enter" || key == " ") {
			start();
		}
		return;
	}
	if (screen == "controls") {ctlkey(event); return;}
	if (event.key == "r" || event.key == "R") {
		start();
		return;
	} else if (event.key == "m" || event.key == "M" || event.key == "Escape") {
		screen = "menu";
		return;
	} else if (event.key == "Tab") {
		const list = gs.filter(g => g.ai && !g.dead);
		if (list.length > 1) tuned = list[(list.indexOf(tuned) + 1) % list.length];
		return;
	} else if (tour && (event.key == " " || event.key == "Enter")) {
		tourAdvance();
		return;
	} else if (tour && (event.key == "s" || event.key == "S")) {
		tourSkip();
		return;
	} else if (/^[0-9]$/.test(event.key)) {
		setlevel(tuned.cfg, event.key == "0" ? 9 : event.key - 1);
		if (!over) unrated = true;
		return;
	} else if (step) {
		bump(tuned.cfg, step);
		if (!over) unrated = true;
		return;
	}
	if (p.ai || p.dead || over) return;
	const act = actionof(event.key);
	const now = performance.now();
	if (act == "left") dirpress(-1, now);
	else if (act == "right") dirpress(1, now);
	else if (act == "soft") softpress();
	else if (act == "hard") drop(p);
	else if (act == "cw") rotatep(p, "cw");
	else if (act == "ccw") rotatep(p, "ccw");
	else if (act == "flip") rotatep(p, "180");
	else if (act == "morph") morph(p);
	else if (act == "hold" && p.hold) swap(p);
};
      window.onkeyup = (event) => {
      	delete pres[event.key];
      	const act = actionof(event.key);
      	const now = performance.now();
      	if (act == "left") drelease(-1, now);
      	else if (act == "right") drelease(1, now);
      	else if (act == "soft") inp.soft = false;
      };
      function release() { // clear stuck keys when focus is lost
      	pres = {};
      	inp = newinp();
      }
      window.addEventListener("blur", release);
      document.addEventListener("visibilitychange", () => {if (document.hidden) release();});
    </script>
  </body>
